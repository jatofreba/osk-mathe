name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Das Python-Tool braucht openpyxl und tkinter - das System-Python von Ubuntu
      # bekommt beides zuverlaessig ueber apt.
      - name: Python fuer das Tool
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-openpyxl

      - name: pglite fuer die Datenbank-Tests
        run: npm install --prefix tests --no-audit --no-fund

      - name: Tests
        run: npm test
        env:
          CI: 'true'
